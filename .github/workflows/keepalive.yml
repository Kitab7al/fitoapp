name: Supabase Keep-Alive

# Зачем: Supabase на бесплатном тарифе усыпляет проект после ~7 дней простоя,
# и тогда перестаёт работать регистрация/вход и вся работа с базой.
# Этот workflow раз в сутки делает лёгкий запрос к базе — этого достаточно,
# чтобы проект считался активным и не уходил в паузу.
#
# Запускается автоматически по расписанию, а также вручную:
# вкладка Actions → Supabase Keep-Alive → Run workflow.
#
# Примечание: ключ ниже — ПУБЛИЧНЫЙ анонимный ключ Supabase (он и так лежит
# во фронтенде, это не секрет). service_role ключ сюда класть нельзя.
#
# ВАЖНО: GitHub отключает запланированные workflow, если в репозитории не было
# активности 60 дней. Пока проект в работе — это не проблема.

on:
  schedule:
    - cron: '23 7 * * *'   # каждый день в 07:23 UTC
  workflow_dispatch:        # ручной запуск кнопкой

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (keep DB warm)
        env:
          SUPABASE_URL: https://hkwmjyvccwewbibjswtx.supabase.co
          SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrd21qeXZjY3dld2JpYmpzd3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyODI0MDIsImV4cCI6MjA4ODg1ODQwMn0.Nh_ICh8dW4707Dq9LNyIMkbUxa478_QLQcGt6yTyzZw
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "$SUPABASE_URL/rest/v1/exercises?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON" \
            -H "Authorization: Bearer $SUPABASE_ANON")
          echo "Supabase responded: HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Keep-alive ping failed (HTTP $CODE) — проект мог уснуть или отвалиться."
            exit 1
          fi
          echo "✅ Проект активен, база отвечает."
