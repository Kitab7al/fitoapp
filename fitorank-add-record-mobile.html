<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitoRank — Добавить рекорд</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--black:#080808;--white:#f5f2ee;--red:#e8260b;--red-dark:#b51e08;--gray:#1a1a1a;--gray-mid:#2e2e2e;--gray-light:#888;--green:#3ddc84;--gold:#f5c842;--blue:#4a9eff;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--black);color:var(--white);font-family:'Montserrat',sans-serif;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4;}
.lang-switcher{position:fixed;top:16px;right:16px;z-index:200;display:flex;background:rgba(26,26,26,.92);border:1px solid var(--gray-mid);backdrop-filter:blur(8px);overflow:hidden;}
.lang-btn{background:none;border:none;color:var(--gray-light);font-family:'Montserrat',sans-serif;font-size:.55rem;font-weight:700;letter-spacing:.1em;padding:7px 11px;cursor:pointer;transition:all .2s;}
.lang-btn.active{background:var(--red);color:var(--white);}
.screens{position:fixed;inset:0;z-index:1;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateX(32px);transition:opacity .3s ease,transform .3s ease;overflow-y:auto;overflow-x:hidden;}
.screen.active{opacity:1;pointer-events:all;transform:translateX(0);}
.screen.exit{opacity:0;transform:translateX(-32px);}
.sh-header{padding:calc(env(safe-area-inset-top,0px) + 52px) 24px 20px;border-bottom:1px solid var(--gray-mid);flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:7px;color:var(--gray-light);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:none;border:none;cursor:pointer;padding:0;margin-bottom:18px;}
.back-btn svg{width:14px;height:14px;flex-shrink:0;}
.sh-tag{font-size:.52rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
.sh-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;line-height:1.05;margin-bottom:4px;}
.sh-sub{font-size:.64rem;color:var(--gray-light);line-height:1.6;}
.step-dots{display:flex;gap:6px;margin-top:12px;}
.dot{width:18px;height:3px;background:var(--gray-mid);border-radius:2px;transition:all .3s;}
.dot.active{background:var(--red);width:28px;}
.dot.done{background:var(--green);}
.form-body{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding-bottom:8px;}
.form-footer{padding:12px 24px calc(env(safe-area-inset-bottom,0px) + 20px);flex-shrink:0;border-top:1px solid rgba(255,255,255,.06);background:var(--black);}
.field{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:.52rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray-light);}
.field-input{background:var(--gray);border:1px solid var(--gray-mid);color:var(--white);font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:600;padding:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;border-radius:0;width:100%;}
.field-input::placeholder{color:var(--gray-light);font-weight:400;font-size:.85rem;}
.field-input:focus{border-color:var(--red);}
.field-input[type="date"]{color-scheme:dark;}
/* STEP 0 */
#s-step0 .form-body{padding:0;gap:0;}
.type-choice{display:flex;flex-direction:column;flex:1;}
.type-card{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:28px 28px 36px;cursor:pointer;position:relative;overflow:hidden;transition:background .2s;background:var(--gray);border:none;text-align:left;width:100%;}
.type-card::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s;}
.card-1rm::after{background:linear-gradient(135deg,rgba(232,38,11,.18) 0%,transparent 65%);}
.card-reps::after{background:linear-gradient(135deg,rgba(245,200,66,.12) 0%,transparent 65%);}
.type-card:active::after{opacity:1;}
.type-card:active{background:#1e1e1e;}
.tc-icon{font-size:2.8rem;margin-bottom:12px;display:block;line-height:1;position:relative;z-index:1;}
.tc-tag{font-size:.5rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px;position:relative;z-index:1;}
.tc-tag.red{color:var(--red);}
.tc-tag.gold{color:var(--gold);}
.tc-name{font-family:'Bebas Neue',sans-serif;font-size:2.3rem;line-height:1;margin-bottom:8px;position:relative;z-index:1;}
.tc-desc{font-size:.63rem;color:var(--gray-light);line-height:1.65;max-width:270px;position:relative;z-index:1;}
.tc-arrow{position:absolute;right:24px;bottom:32px;font-size:1.3rem;color:var(--gray-light);transition:transform .2s,color .2s;z-index:1;}
.type-card:active .tc-arrow{transform:translateX(5px);color:var(--white);}
.tc-divider{height:1px;background:rgba(255,255,255,.06);flex-shrink:0;}
/* EXERCISE */
.ex-search-wrap{position:relative;}
.ex-search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-light);font-size:.9rem;pointer-events:none;}
.field-input.with-icon{padding-left:40px;}
.ex-results{background:var(--gray);border:1px solid var(--gray-mid);border-top:none;display:none;max-height:180px;overflow-y:auto;}
.ex-results.show{display:block;}
.ex-item{padding:11px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;transition:background .15s;}
.ex-item:last-child{border-bottom:none;}
.ex-item:active{background:var(--gray-mid);}
.ex-item-name{font-size:.8rem;font-weight:600;}
.ex-item-cat{font-size:.5rem;color:var(--gray-light);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
.ex-selected{background:rgba(232,38,11,.08);border:1px solid rgba(232,38,11,.3);padding:12px 14px;display:none;align-items:center;justify-content:space-between;}
.ex-selected.show{display:flex;}
.ex-sel-name{font-size:.85rem;font-weight:700;}
.ex-sel-cat{font-size:.52rem;color:var(--red);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}
.ex-sel-clear{background:none;border:none;color:var(--gray-light);font-size:1.1rem;cursor:pointer;padding:4px;}
/* TABS */
.rm-tabs{display:flex;border:1px solid var(--gray-mid);overflow:hidden;}
.rm-tab{flex:1;background:none;border:none;color:var(--gray-light);font-family:'Montserrat',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:11px 8px;cursor:pointer;transition:all .2s;border-right:1px solid var(--gray-mid);}
.rm-tab:last-child{border-right:none;}
.rm-tab.active{background:var(--red);color:var(--white);}
/* BW */
.bw-toggle{display:none;flex-direction:column;gap:6px;animation:fadeUp .2s ease;}
.bw-toggle.show{display:flex;}
.bw-options{display:flex;gap:6px;flex-wrap:wrap;}
.bw-chip{flex:1;min-width:0;background:var(--gray);border:1px solid var(--gray-mid);color:var(--gray-light);font-family:'Montserrat',sans-serif;font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 6px;cursor:pointer;text-align:center;transition:all .2s;}
.bw-chip.active{background:var(--gold);border-color:var(--gold);color:var(--black);}
.bw-chip:active{transform:scale(.95);}
/* WEIGHT */
.weight-wrap{position:relative;}
.weight-unit-toggle{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;}
.unit-btn{height:100%;padding:0 12px;background:var(--gray-mid);border:none;border-left:1px solid #3a3a3a;color:var(--gray-light);font-family:'Montserrat',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
.unit-btn.active{background:var(--red);color:var(--white);}
.field-input.weight-input{padding-right:96px;font-size:1.3rem;font-weight:700;}
/* REPS */
.reps-quick{display:flex;gap:6px;flex-wrap:wrap;}
.rep-chip{background:var(--gray);border:1px solid var(--gray-mid);color:var(--gray-light);font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:700;padding:9px 13px;cursor:pointer;transition:all .2s;}
.rep-chip.active{background:var(--red);border-color:var(--red);color:var(--white);}
.rep-chip:active{transform:scale(.93);}
.reps-custom-row{display:none;gap:8px;align-items:center;margin-top:4px;}
.reps-custom-row.show{display:flex;}
.reps-custom-label{font-size:.6rem;color:var(--gray-light);white-space:nowrap;}
.field-input.reps-input{width:90px;text-align:center;font-size:1.1rem;}
/* LEVEL */
.level-badge{display:none;padding:13px 14px;gap:12px;align-items:center;animation:fadeUp .3s ease;}
.level-badge.show{display:flex;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.level-icon{font-size:2rem;flex-shrink:0;line-height:1;}
.level-info{flex:1;}
.level-name{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;line-height:1;}
.level-desc{font-size:.58rem;color:var(--gray-light);margin-top:2px;line-height:1.5;}
.level-bar-wrap{height:4px;background:var(--gray-mid);margin-top:8px;overflow:hidden;}
.level-bar{height:100%;transition:width .6s ease;width:0%;}
.level-next{font-size:.52rem;color:var(--gray-light);margin-top:5px;letter-spacing:.06em;}
/* PREVIEW */
.preview-card{background:var(--gray-mid);border:1px solid rgba(255,255,255,.08);padding:12px 14px;display:flex;gap:12px;align-items:center;}
.pc-media{width:40px;height:40px;background:var(--gray);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border:1px solid rgba(255,255,255,.08);}
.pc-exercise{font-size:.5rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-light);margin-bottom:2px;}
.pc-weight{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;line-height:1;}
.pc-unit{font-size:.75rem;color:var(--gray-light);}
.pc-meta{font-size:.54rem;color:var(--gray-light);margin-top:2px;}
.pc-type-badge{margin-left:auto;font-size:.48rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;flex-shrink:0;}
.pc-type-badge.one-rm{background:rgba(232,38,11,.15);color:var(--red);border:1px solid rgba(232,38,11,.3);}
.pc-type-badge.multi-rep{background:rgba(245,200,66,.1);color:var(--gold);border:1px solid rgba(245,200,66,.3);}
/* BUTTONS */
.btn-p{width:100%;background:var(--red);color:var(--white);border:none;font-family:'Montserrat',sans-serif;font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .1s;-webkit-appearance:none;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);}
.btn-p:active{background:var(--red-dark);transform:scale(.98);}
.btn-p:disabled{opacity:.4;pointer-events:none;}
.btn-s{width:100%;background:transparent;color:var(--white);border:1px solid var(--gray-mid);font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s;}
.btn-s:active{border-color:var(--white);}
/* STEP 2 */
.url-wrap{position:relative;}
.url-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.9rem;pointer-events:none;}
.field-input.url-input{padding-left:40px;font-size:.82rem;}
.link-preview{background:var(--gray);border:1px solid var(--gray-mid);padding:13px;display:none;gap:11px;align-items:flex-start;animation:fadeUp .25s ease;}
.link-preview.show{display:flex;}
.lp-thumb{width:52px;height:52px;background:var(--gray-mid);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.lp-platform{font-size:.5rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:3px;}
.lp-title{font-size:.75rem;font-weight:600;line-height:1.4;}
.lp-handle{font-size:.58rem;color:var(--gray-light);margin-top:2px;}
.lp-ok{font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-top:5px;}
.url-hint{font-size:.56rem;color:var(--gray-light);line-height:1.6;}
.freak-btn{background:none;border:1px dashed var(--gray-mid);color:var(--gray-light);font-family:'Montserrat',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;cursor:pointer;transition:all .2s;text-align:left;width:100%;margin-top:6px;}
.freak-btn:active,.freak-btn.active{border-color:var(--gold);color:var(--gold);}
.freak-wrap{margin-top:6px;display:flex;flex-direction:column;gap:6px;}
.video-required-hint{font-size:.6rem;color:var(--gray-light);text-align:center;padding:2px 0;line-height:1.5;}
.video-required-hint.error{color:var(--red);}
.field-textarea{background:var(--gray);border:1px solid var(--gray-mid);color:var(--white);font-family:'Montserrat',sans-serif;font-size:.85rem;padding:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;border-radius:0;width:100%;resize:none;min-height:80px;line-height:1.6;}
.field-textarea::placeholder{color:var(--gray-light);}
.field-textarea:focus{border-color:var(--red);}
.char-count{font-size:.52rem;color:var(--gray-light);text-align:right;margin-top:3px;}
.pub-note{font-size:.58rem;color:var(--gray-light);line-height:1.7;padding:10px 12px;border:1px solid var(--gray-mid);background:rgba(255,255,255,.02);}
.divider{height:1px;background:rgba(255,255,255,.06);}
/* SUCCESS */
#s-success{justify-content:center;align-items:center;text-align:center;padding:40px 28px;background:radial-gradient(ellipse 80% 45% at 50% 35%,rgba(61,220,132,.07) 0%,transparent 70%);}
.success-icon{font-size:3.4rem;margin-bottom:14px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.success-title{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;line-height:1;margin-bottom:8px;}
.success-sub{font-size:.7rem;color:var(--gray-light);line-height:1.7;margin-bottom:24px;max-width:280px;}
.success-card{background:var(--gray);border:1px solid var(--gray-mid);padding:16px 18px;width:100%;max-width:300px;margin:0 auto 24px;text-align:left;border-left:3px solid var(--green);}
.sc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.sc-label{font-size:.5rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-light);}
.sc-val{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;line-height:1;}
.sc-sub{font-size:.58rem;color:var(--gray-light);margin-top:5px;}
.success-actions{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px;}
</style>
</head>
<body>
<div class="lang-switcher">
  <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
  <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
</div>
<div class="screens">

<!-- STEP 0 -->
<div class="screen" id="s-step0">
  <div class="sh-header">
    <button class="back-btn" onclick="goFeed()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 12L6 8l4-4"/></svg>
      <span data-t="back"></span>
    </button>
    <div class="sh-tag" data-t="s0_tag"></div>
    <div class="sh-title" data-t="s0_title"></div>
    <div class="sh-sub" data-t="s0_sub"></div>
    <div class="step-dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
  <div class="form-body">
    <div class="type-choice">
      <button class="type-card card-1rm" onclick="chooseType('1rm')">
        <span class="tc-icon">&#127942;</span>
        <div class="tc-tag red" data-t="tc_tag_1rm"></div>
        <div class="tc-name" data-t="tc_name_1rm"></div>
        <div class="tc-desc" data-t="tc_desc_1rm"></div>
        <span class="tc-arrow">&#8594;</span>
      </button>
      <div class="tc-divider"></div>
      <button class="type-card card-reps" onclick="chooseType('reps')">
        <span class="tc-icon">&#128293;</span>
        <div class="tc-tag gold" data-t="tc_tag_reps"></div>
        <div class="tc-name" data-t="tc_name_reps"></div>
        <div class="tc-desc" data-t="tc_desc_reps"></div>
        <span class="tc-arrow">&#8594;</span>
      </button>
    </div>
  </div>
</div>

<!-- STEP 1 -->
<div class="screen" id="s-step1">
  <div class="sh-header">
    <button class="back-btn" onclick="go('s-step0')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 12L6 8l4-4"/></svg>
      <span data-t="back"></span>
    </button>
    <div class="sh-tag" id="s1_tag"></div>
    <div class="sh-title" id="s1_title"></div>
    <div class="sh-sub" data-t="s1_sub"></div>
    <div class="step-dots"><div class="dot done"></div><div class="dot active"></div><div class="dot"></div></div>
  </div>
  <div class="form-body">
    <div class="field">
      <div class="field-label" data-t="ex_label"></div>
      <div class="ex-search-wrap">
        <span class="ex-search-icon">&#128269;</span>
        <input class="field-input with-icon" id="exInput" type="text" oninput="searchEx(this.value)" onfocus="searchEx(this.value)" data-t-ph="ex_ph">
        <div class="ex-results" id="exResults"></div>
      </div>
      <button class="freak-btn" id="freakBtn" onclick="toggleFreak()" data-t="freak_btn"></button>
      <div class="freak-wrap" id="freakWrap" style="display:none;">
        <input class="field-input" id="freakInput" type="text" oninput="onFreakInput()" data-t-ph="freak_ph">
        <div class="url-hint" data-t="freak_hint"></div>
      </div>
      <div class="ex-selected" id="exSelected">
        <div><div class="ex-sel-name" id="exSelName"></div><div class="ex-sel-cat" id="exSelCat"></div></div>
        <button class="ex-sel-clear" onclick="clearEx()">&#10005;</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="field">
      <div class="field-label" data-t="result_label"></div>
      <div class="rm-tabs">
        <button class="rm-tab active" id="rmTab1rm" onclick="setSubType('1rm')" data-t="tab_1rm"></button>
        <button class="rm-tab" id="rmTabReps" onclick="setSubType('reps')" data-t="tab_reps"></button>
      </div>
      <div class="bw-toggle" id="bwToggle">
        <div class="field-label" data-t="bw_label"></div>
        <div class="bw-options">
          <button class="bw-chip active" onclick="setBW(this,'bw')" data-t="bw_only"></button>
          <button class="bw-chip" onclick="setBW(this,'bw+ext')" data-t="bw_plus"></button>
          <button class="bw-chip" onclick="setBW(this,'ext')" data-t="bw_ext"></button>
        </div>
      </div>
      <div id="weightField">
        <div class="weight-wrap">
          <input class="field-input weight-input" id="weightInput" type="number" inputmode="decimal" min="0" max="9999" step="0.5" oninput="onWeightInput()" placeholder="0">
          <div class="weight-unit-toggle">
            <button class="unit-btn active" id="unitKg" onclick="setUnit('kg')">KG</button>
            <button class="unit-btn" id="unitLbs" onclick="setUnit('lbs')">LBS</button>
          </div>
        </div>
      </div>
      <div id="repsSection" style="display:none;">
        <div class="field-label" style="margin-top:4px;" data-t="reps_label"></div>
        <div class="reps-quick">
          <button class="rep-chip" onclick="setRep(this,2)">2</button>
          <button class="rep-chip" onclick="setRep(this,3)">3</button>
          <button class="rep-chip" onclick="setRep(this,5)">5</button>
          <button class="rep-chip active" onclick="setRep(this,10)">10</button>
          <button class="rep-chip" onclick="setRep(this,15)">15</button>
          <button class="rep-chip" onclick="setRep(this,20)">20</button>
          <button class="rep-chip" id="repCustomChip" onclick="toggleCustomRep(this)">+</button>
        </div>
        <div class="reps-custom-row" id="repsCustomRow">
          <span class="reps-custom-label" data-t="reps_custom_label"></span>
          <input class="field-input reps-input" id="repsInput" type="number" inputmode="numeric" min="1" max="999" oninput="onRepsInput()">
        </div>
      </div>
    </div>
    <div class="level-badge" id="levelBadge">
      <div class="level-icon" id="lvlIcon">&#127945;</div>
      <div class="level-info">
        <div class="level-name" id="lvlName"></div>
        <div class="level-desc" id="lvlDesc"></div>
        <div class="level-bar-wrap"><div class="level-bar" id="lvlBar"></div></div>
        <div class="level-next" id="lvlNext"></div>

function toggleCustomRep(btn){customRep=!customRep;document.querySelectorAll('.rep-chip').forEach(b=>b.classList.remove('active'));btn.classList.toggle('active',customRep);document.getElementById('repsCustomRow').classList.toggle('show',customRep);if(customRep)document.getElementById('repsInput').focus();}
function onRepsInput(){const v=parseInt(document.getElementById('repsInput').value)||0;if(v>0)reps=v;updatePreview();calcLevel();checkStep1();}
function calcLevel(){const badge=document.getElementById('levelBadge');const t=T[lang];if(!selectedEx){badge.classList.remove('show');return;}const wRaw=parseFloat(document.getElementById('weightInput').value);let value;if(selectedEx.bw){if(bwMode==='bw'){value=reps;}else{if(isNaN(wRaw)||wRaw<=0){badge.classList.remove('show');return;}value=unit==='lbs'?wRaw*0.453592:wRaw;}}else{if(isNaN(wRaw)||wRaw<=0){badge.classList.remove('show');return;}value=unit==='lbs'?wRaw*0.453592:wRaw;if(subType==='reps'&&reps>1)value=value*(1+reps/30);}const std=STANDARDS[selectedEx.id];if(!std){badge.classList.remove('show');return;}let lvlIdx=0;for(let i=std.length-1;i>=0;i--){if(value>=std[i]){lvlIdx=i;break;}}const key=LV_KEYS[lvlIdx];const color=LV_COLORS[lvlIdx];const icon=LV_ICONS[lvlIdx];const name=t['lv_'+key];const desc=t['lv_'+key+'_d'];let pct=0,nextStr='';if(lvlIdx<std.length-1){const lo=std[lvlIdx],hi=std[lvlIdx+1];pct=Math.min(99,Math.round(((value-lo)/(hi-lo))*100));const diff=Math.round((hi-value)*10)/10;const unitLbl=selectedEx.bw&&bwMode==='bw'?(lang==='ru'?'пов.':'reps'):(unit==='lbs'?t.lbs:t.kg);nextStr=t.lv_next+(diff>0?'+'+diff+' '+unitLbl:'');}else{nextStr=t.lv_peak;}document.getElementById('lvlIcon').textContent=icon;document.getElementById('lvlName').textContent=name;document.getElementById('lvlDesc').textContent=desc;document.getElementById('lvlBar').style.cssText='width:'+pct+'%;background:'+color+';';document.getElementById('lvlNext').textContent=nextStr;badge.style.cssText='border:1px solid '+color+'33;background:'+color+'0d;';badge.classList.add('show');}
function updatePreview(){const t=T[lang];const w=document.getElementById('weightInput').value||'—';const d=document.getElementById('dateInput').value;const unitLbl=unit==='lbs'?t.lbs:t.kg;const exName=selectedEx?selectedEx.name[lang]:t.no_ex;const repsStr=reps+' '+(reps===1?t.rep:t.reps_unit);let weightStr,unitStr,metaStr;if(selectedEx&&selectedEx.bw&&bwMode==='bw'){weightStr=repsStr;unitStr='';metaStr=formatDate(d);}else{weightStr=w==='—'?'—':w;unitStr=' '+unitLbl;metaStr=(subType==='reps'?repsStr+' · ':'')+formatDate(d);}document.getElementById('pcExercise').textContent=exName;document.getElementById('pcWeight').textContent=weightStr;document.getElementById('pcUnit').textContent=unitStr;document.getElementById('pcMeta').textContent=metaStr;updatePcTypeBadge();}
function updatePcTypeBadge(){const t=T[lang];const is1rm=(subType==='1rm');const lbl=is1rm?t.badge_1rm:t.badge_reps;const cls='pc-type-badge '+(is1rm?'one-rm':'multi-rep');['pcTypeBadge','pcTypeBadge2'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=lbl;el.className=cls;}});}
function syncStep2Preview(){['pcExercise','pcWeight','pcUnit','pcMeta'].forEach(id=>{const el2=document.getElementById(id+'2');if(el2)el2.textContent=document.getElementById(id).textContent||'';});}
function formatDate(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return d+'.'+m+'.'+y;}
function checkStep1(){const hasEx=isFreak?(freakName.length>0):!!selectedEx;const bwOnly=selectedEx&&selectedEx.bw&&bwMode==='bw';const hasW=isFreak||bwOnly||!!document.getElementById('weightInput').value;const hasD=!!document.getElementById('dateInput').value;const hasAthW=!!document.getElementById('athWeightInput').value;document.getElementById('s1Btn').disabled=!(hasEx&&hasW&&hasD&&hasAthW);}
function handleUrl(val){val=val.trim();const preview=document.getElementById('linkPreview');const icon=document.getElementById('urlIcon');if(val.includes('tiktok.com')){icon.textContent='🎵';document.getElementById('lpPlatform').textContent='TikTok';document.getElementById('lpThumb').textContent='▶';document.getElementById('lpTitle').textContent=lang==='ru'?'Видео из TikTok':'TikTok video';document.getElementById('lpHandle').textContent=extractHandle(val);preview.classList.add('show');}else if(val.includes('instagram.com')||val.includes('instagr.am')){icon.textContent='📸';document.getElementById('lpPlatform').textContent='Instagram';document.getElementById('lpThumb').textContent=val.includes('/reel')?'▶':'📷';document.getElementById('lpTitle').textContent=lang==='ru'?'Публикация из Instagram':'Instagram post';document.getElementById('lpHandle').textContent=extractHandle(val);preview.classList.add('show');}else if(val.includes('youtube.com')||val.includes('youtu.be')){icon.textContent='▶';document.getElementById('lpPlatform').textContent='YouTube';document.getElementById('lpThumb').textContent='▶';document.getElementById('lpTitle').textContent=lang==='ru'?'Видео YouTube':'YouTube video';document.getElementById('lpHandle').textContent='';preview.classList.add('show');}else{icon.textContent='🔗';preview.classList.remove('show');}checkVideo();}
function extractHandle(url){try{const p=new URL(url).pathname.split('/').filter(Boolean);if(p[0])return '@'+p[0].replace('@','');}catch(e){}return '';}
function checkVideo(){const url=document.getElementById('urlInput').value.trim();const hasVideo=url.includes('tiktok.com')||url.includes('instagram.com')||url.includes('instagr.am')||url.includes('youtube.com')||url.includes('youtu.be');const btn=document.getElementById('pubBtn');const hint=document.getElementById('videoRequiredHint');btn.disabled=!hasVideo;hint.classList.toggle('error',!hasVideo&&url.length>0);return hasVideo;}
function publish(){if(!checkVideo())return;const t=T[lang];const w=document.getElementById('weightInput').value;const bwOnly=selectedEx&&selectedEx.bw&&bwMode==='bw';const exName=isFreak?('🎪 '+freakName):(selectedEx?selectedEx.name[lang]:'—');document.getElementById('scEx').textContent=exName;document.getElementById('scW').textContent=bwOnly?(reps+' '+(reps===1?t.rep:t.reps_unit)):(w+' '+(unit==='lbs'?t.lbs:t.kg));document.getElementById('scMeta').textContent=formatDate(document.getElementById('dateInput').value);go('s-success');}
function addAnother(){resetForm();go('s-step0');}
function resetForm(){selectedEx=null;isFreak=false;freakName='';league='pro';document.getElementById('exInput').value='';document.getElementById('exSelected').classList.remove('show');document.getElementById('bwToggle').classList.remove('show');document.getElementById('weightInput').value='';document.getElementById('athWeightInput').value='';document.getElementById('weightField').style.display='';document.getElementById('repsInput').value='';document.getElementById('repsCustomRow').classList.remove('show');document.getElementById('urlInput').value='';document.getElementById('commentInput').value='';document.getElementById('charCount').textContent='0';document.getElementById('linkPreview').classList.remove('show');document.getElementById('levelBadge').classList.remove('show');document.getElementById('pcMedia').textContent='🏋️';document.getElementById('pcMedia2').textContent='🏋️';document.getElementById('freakBtn').classList.remove('active');document.getElementById('freakWrap').style.display='none';document.getElementById('freakInput').value='';document.querySelector('.ex-search-wrap').style.display='';setLeague('pro');recordType='1rm';subType='1rm';bwMode='bw';reps=10;customRep=false;updateRmTabs();updateRepsSection();updatePreview();checkStep1();checkVideo();}
const today=new Date();const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');document.getElementById('dateInput').value=todayStr;document.getElementById('dateInput').max=todayStr;
setLang(lang);setLeague('pro');checkVideo();go('s-step0');
</script>
